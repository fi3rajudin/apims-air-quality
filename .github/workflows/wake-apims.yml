name: Wake APIMS

on:
  schedule:
    - cron: '57 5 * * *'
      timezone: 'Asia/Kuala_Lumpur'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest

    steps:
      - name: Wake APIMS and wait for health
        shell: bash
        run: |
          URL="https://apims-air-quality.onrender.com/actuator/health"

          echo "Waking APIMS..."

          delays=(15 30 45 60 90 120)

          for i in {1..6}; do
            echo "Attempt $i"

            STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
              --max-time 30 \
              "$URL" || true)

            cat /tmp/response.txt || true
            echo
            echo "HTTP status: $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "APIMS is awake."
              exit 0
            fi

            if [ "$i" -lt 6 ]; then
              DELAY=${delays[$((i-1))]}
              echo "Waiting ${DELAY}s before retry..."
              sleep "$DELAY"
            fi
          done

          echo "APIMS did not become healthy in time."
          exit 1