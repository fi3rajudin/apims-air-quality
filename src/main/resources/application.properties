spring.application.name=apims-air-quality
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never

# DOE APIMS upstream endpoint. Query parameters are added by DoeApimsService.
doe.apims.url=https://eqms.doe.gov.my/api3/publicmapproxy/PUBLIC_DISPLAY/CAQM_MCAQM_Current_Reading/MapServer/0/query
doe.apims.cache-ttl=5m

# Public Nominatim geocoding. Keep requests user-triggered, cached, and <= 1 request/sec.
geocoding.url=https://nominatim.openstreetmap.org/search
geocoding.user-agent=${GEOCODING_USER_AGENT:RainCheck-APIMS/1.0}
geocoding.cache-ttl=24h
geocoding.min-request-interval=1100ms

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
